name: Build and deploy Signal Atlas

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [public/version.json]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm generate
      - name: Check reproducible catalogue
        run: git diff --exit-code -- src/data/atlas.json public/examples/complete-cycle.json
      - name: Configure Pages
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        id: pages
        uses: actions/configure-pages@v5
      - run: pnpm build
        env:
          PAGES_BASE_PATH: ${{ format('{0}/', steps.pages.outputs.base_path) }}
      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
