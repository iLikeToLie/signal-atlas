name: Build and deploy Signal Atlas

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [release/v0.1.6]
    paths: [public/version.json, .github/workflows/pages.yml]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Read release version
        id: version
        run: |
          python - <<'PY'
          import json, os
          version = json.load(open('public/version.json'))['version']
          assert version == json.load(open('package.json'))['version']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm generate
      - name: Check reproducible catalogue
        run: git diff --exit-code -- src/data/atlas.json public/examples/complete-cycle.json
      - name: Configure Pages
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        id: pages
        uses: actions/configure-pages@v5
      - run: pnpm build
        env:
          PAGES_BASE_PATH: ${{ format('{0}/', steps.pages.outputs.base_path) }}
      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published version
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_VERSION: ${{ needs.build.outputs.release_version }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          expected = os.environ['EXPECTED_VERSION']
          url = os.environ['PAGE_URL'].rstrip('/') + '/version.json'
          for attempt in range(12):
              try:
                  request = urllib.request.Request(url + '?release=' + expected, headers={'Cache-Control': 'no-cache'})
                  with urllib.request.urlopen(request, timeout=10) as response:
                      actual = json.load(response)['version']
                  if actual == expected:
                      print(f'Published version verified: {actual} at {url}')
                      break
              except Exception as error:
                  print(f'Version check pending: {error}')
              time.sleep(5)
          else:
              raise SystemExit(f'Pages did not serve expected version {expected}')
          PY
