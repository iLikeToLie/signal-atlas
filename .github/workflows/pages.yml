name: Build and deploy Signal Atlas

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [feature/revised-inputs]
    paths: [public/version.json, .github/workflows/pages.yml]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      preview_version: ${{ steps.version.outputs.version }}
      preview_revision: ${{ steps.version.outputs.revision }}
      preview_tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Read preview version
        id: version
        run: |
          python - <<'PY'
          import json, os
          metadata = json.load(open('public/version.json'))
          version = metadata['version']
          assert version == json.load(open('package.json'))['version']
          tag = metadata.get('tag', '')
          assert not tag or tag == 'v' + version
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
              output.write(f'revision={metadata.get("revision", "")}\n')
              output.write(f'tag={tag}\n')
          PY
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm generate
      - name: Check reproducible catalogue
        run: git diff --exit-code -- src/data/atlas.json public/examples/complete-cycle.json
      - name: Configure Pages
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        id: pages
        uses: actions/configure-pages@v5
      - run: pnpm build
        env:
          PAGES_BASE_PATH: ${{ format('{0}/', steps.pages.outputs.base_path) }}
      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  tag-preview:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feature/revised-inputs' && needs.build.outputs.preview_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Tag the validated preview
        env:
          PREVIEW_TAG: ${{ needs.build.outputs.preview_tag }}
        run: |
          git check-ref-format "refs/tags/$PREVIEW_TAG"
          if git rev-parse --verify "refs/tags/$PREVIEW_TAG" >/dev/null 2>&1; then
            test "$(git rev-parse "$PREVIEW_TAG^{commit}")" = "$GITHUB_SHA" || {
              echo "Existing preview tag points to another commit; refusing to replace it."
              exit 1
            }
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$PREVIEW_TAG" -m "Validated Signal Atlas preview $PREVIEW_TAG"
          git push origin "refs/tags/$PREVIEW_TAG"

  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published version
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_VERSION: ${{ needs.build.outputs.preview_version }}
          EXPECTED_REVISION: ${{ needs.build.outputs.preview_revision }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          expected = os.environ['EXPECTED_VERSION']
          revision = os.environ['EXPECTED_REVISION']
          url = os.environ['PAGE_URL'].rstrip('/') + '/version.json'
          for attempt in range(12):
              try:
                  request = urllib.request.Request(url + '?preview=' + expected + '&revision=' + revision, headers={'Cache-Control': 'no-cache'})
                  with urllib.request.urlopen(request, timeout=10) as response:
                      metadata = json.load(response)
                  if metadata['version'] == expected and metadata.get('revision', '') == revision:
                      print(f'Published preview verified: {expected} / {revision} at {url}')
                      break
              except Exception as error:
                  print(f'Version check pending: {error}')
              time.sleep(5)
          else:
              raise SystemExit(f'Pages did not serve expected preview {expected} / {revision}')
          PY
